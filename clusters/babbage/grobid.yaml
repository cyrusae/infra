---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grobid
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/grobid
  sourceRef:
    kind: GitRepository
    name: flux-system
  # PRUNE IS OFF DELIBERATELY.
  # Turn on only after enumerating every hand-created object in this
  # namespace. See SESSION 15 §3.6 — the documented workflow of creating
  # namespaces and secrets by hand with kubectl conflicts with pruning.
  prune: false
  wait: true
  timeout: 5m
